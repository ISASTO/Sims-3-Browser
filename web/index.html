<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Sims 3 (private port)</title>
<style>
  :root { --bg: #0b0d10; --fg: #d8dee6; --dim: #7d8794; --err: #ffb4a8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* landscape iPhone 6 class screen: 667 x 375 points */
  #stage { position: relative; width: min(100vw, calc(100vh * 667 / 375)); aspect-ratio: 667 / 375; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }
  .hostview { position: absolute; pointer-events: none; object-fit: fill; box-sizing: border-box; }
  .hostinput { pointer-events: auto; border: 1px solid #888; border-radius: 4px; background: #fff; color: #000; padding: 0 6px; font: 600 16px system-ui, sans-serif; outline: none; }
  .hostweb { pointer-events: auto; border: 0; background: #fff; }
  .hostbar { pointer-events: auto; background: #f7f7f7; border-bottom: 1px solid #c8c7cc; display: flex; align-items: center; justify-content: center; font: 600 15px system-ui, sans-serif; color: #000; }
  .hostbar .barbtn { position: absolute; top: 50%; transform: translateY(-50%); border: 0; background: none; color: #007aff; font: 15px system-ui, sans-serif; cursor: pointer; padding: 4px 10px; }
  .hostbar .barbtn.left { left: 4px; } .hostbar .barbtn.right { right: 4px; }
  #status { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; color: var(--dim); }
  #meter { position: fixed; right: 8px; bottom: 6px; color: var(--dim); font: 11px ui-monospace, Menlo, monospace; opacity: .7; pointer-events: none; }
  #error { display: none; position: fixed; inset: 5%; overflow: auto; background: #1a1112; color: var(--err); border: 1px solid #5a2a2a; padding: 16px; white-space: pre-wrap; font: 12px ui-monospace, Menlo, monospace; z-index: 10; }
  .toast { position: fixed; left: 50%; top: 10%; transform: translateX(-50%); background: #222a; color: var(--fg); padding: 8px 14px; border-radius: 6px; z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="screen" width="1334" height="750"></canvas><div id="status">Loading…</div></div></div>
<div id="meter"></div>
<pre id="error"></pre>
<script type="module" src="sims3.js"></script>
</body>
</html>
